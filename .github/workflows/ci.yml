name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: tests + types (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # Editable install pulls PySide6 + rich (runtime) and pytest + mypy (dev).
        # PySide6.QtCore imports headlessly, so no display server is needed for
        # the suite — nothing instantiates a widget.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Type check (mypy)
        # Config in pyproject.toml pins the files + PySide6 stub handling.
        run: python -m mypy

      - name: Run tests
        run: python -m pytest -q
