<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life — A Deeper Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Newsreader:ital,opsz@0,6..72;1,6..72&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="life-ui.css">
<style>
  /* Mount-point sizing + base palette.
     Without these, #game has no height — so the pack's .app and .creation
     scenes (both flex layouts) collapse to zero and in-scene fields vanish.
     The body colour rules guarantee a dark canvas with cream text even
     before life-ui.css resolves, so anything outside the pack's chrome
     still reads correctly. */
  html, body { height: 100%; margin: 0; }
  body {
    background: #100d0a;   /* mirrors --bg-0 */
    color: #ece3cf;        /* mirrors --ink  */
  }
  #game { width: 100%; height: 100%; min-height: 100vh; }
</style>
</head>
<body>
<div id="game"></div>
<!-- Load order matters: icons table -> UI toolkit -> mock data -> App
     modules (each augments window.App) -> app.js bootstrap. -->
<script src="lib/icons.js"></script>
<script src="life-ui.js"></script>
<script src="mock_snapshot.js"></script>
<script src="app/screens.js"></script>
<script src="app/modals.js"></script>
<script src="app/creation.js"></script>
<script src="app/feed.js"></script>
<script src="app/bridge.js"></script>
<script src="app/dispatch.js"></script>
<script src="app.js"></script>
</body>
</html>
