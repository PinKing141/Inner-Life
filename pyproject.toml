[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "life-deeper"
version = "0.1.0"
description = "A BitLife-style life simulator with a deterministic Python core and a Qt WebEngine UI."
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
