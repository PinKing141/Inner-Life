[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "life-deeper"
version = "0.1.0"
description = "A BitLife-style life simulator with a deterministic Python core and a Qt WebEngine UI."
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "mypy>=1.8"]

[tool.setuptools]
# Flat layout: tell setuptools exactly which top-level dirs are Python
# packages, so `pip install -e .` doesn't choke on `ui/`, `data/`, etc.
packages = ["core", "core.content", "controller", "bridge", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
files = ["core", "controller", "bridge", "cli", "main.py"]
# Pragmatic baseline: the whole first-party tree type-checks clean today.
# We don't yet require annotations on every def (no disallow_untyped_defs),
# but anything that IS typed must stay internally consistent.
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# PySide6 ships only partial stubs; don't fail the build on its gaps.
module = ["PySide6.*"]
ignore_missing_imports = true
